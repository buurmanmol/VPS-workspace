# Copy to .github/workflows/ci.yml — runs checks on every PR (incl. the ones Claude opens).
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt || pip install -e ".[dev]"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -q
